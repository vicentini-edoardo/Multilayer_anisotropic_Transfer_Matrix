[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilayer-atm"
version = "0.1.0"
description = "Scientific Streamlit workspace for multilayer anisotropic transfer-matrix calculations."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Edoardo Vicentini"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "streamlit>=1.48",
  "plotly>=5.20",
  "materials-library @ git+https://github.com/vicentini-edoardo/Materials_Library.git@bea7ff1f3047a744238e6ed5db6790610ee47c27",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
